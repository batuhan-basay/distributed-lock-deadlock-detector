global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: lockguard-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api-1:8080"]
        labels: { replica: api-1 }
      - targets: ["api-2:8080"]
        labels: { replica: api-2 }

  # DNS service discovery: every replica of `docker compose up --scale detector=N` is scraped.
  - job_name: lockguard-detector
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["detector"]
        type: A
        port: 8080
        refresh_interval: 15s

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
