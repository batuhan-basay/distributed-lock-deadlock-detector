name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DistributedLockDeadlockDetector.slnx

      - name: Build
        run: dotnet build DistributedLockDeadlockDetector.slnx -c Release --no-restore

      - name: Unit tests (in-memory store)
        run: dotnet test tests/LockGuard.Core.Tests -c Release --no-build --logger "console;verbosity=normal"

      - name: Integration tests (3 Redis nodes via Testcontainers)
        run: dotnet test tests/LockGuard.IntegrationTests -c Release --no-build --logger "console;verbosity=normal"

  docker-images:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
